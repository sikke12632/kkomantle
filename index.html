<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리반 꼬맨틀</title>
<!-- 배포할 때마다 ?v= 숫자를 올린다(캐시). common.js 의 VER도 같이 올린다 -->
<link rel="stylesheet" href="app.css?v=6">
</head>
<body>
<div id="sky" aria-hidden="true"><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i></div>

<header id="top">
  <div class="brand"><span class="seal">꼬</span><span class="name">우리반 꼬맨틀</span><span id="dayChip" class="chip"></span></div>
  <div class="topbtns">
    <button id="btnNum" class="numbtn" hidden></button>
    <button id="btnHelp" class="ibtn" aria-label="하는 방법" title="하는 방법">
      <svg viewBox="0 0 24 24"><path d="M12 2.5a9.5 9.5 0 1 0 0 19 9.5 9.5 0 0 0 0-19zm1.2 15.3h-2.4v-2.3h2.4zm2-7.4c-.3.8-1 1.3-1.6 1.8-.6.4-.9.7-.9 1.5v.4h-2.3v-.6c0-1.4.6-2 1.4-2.6.6-.4 1.1-.8 1.1-1.5 0-.8-.6-1.3-1.5-1.3-1 0-1.6.6-1.7 1.6L7.4 9c.2-2.1 1.9-3.4 4.2-3.4 2.4 0 4 1.3 4 3.3 0 .5-.1 1-.4 1.5z"/></svg>
    </button>
  </div>
</header>

<main id="main">
  <section id="hero" class="card">
    <div class="lantern-wrap">
      <svg id="lantern" viewBox="0 0 80 110" aria-hidden="true">
        <defs>
          <radialGradient id="glowG" cx="50%" cy="55%" r="50%"><stop offset="0" stop-color="#fff3c4"/><stop offset=".55" stop-color="#ffc861"/><stop offset="1" stop-color="#e8743b"/></radialGradient>
        </defs>
        <path d="M40 2v10" stroke="#5a4636" stroke-width="3" stroke-linecap="round"/>
        <rect x="26" y="10" width="28" height="7" rx="2" fill="#5a4636"/>
        <path id="lanternBody" d="M18 40C18 24 28 17 40 17s22 7 22 23v28c0 16-10 23-22 23S18 84 18 68z" fill="url(#glowG)"/>
        <path d="M30 18c-5 8-6 18-6 36s1 28 6 36M50 18c5 8 6 18 6 36s-1 28-6 36M40 17v74" stroke="#b9572b" stroke-width="1.6" fill="none" opacity=".55"/>
        <rect x="26" y="90" width="28" height="7" rx="2" fill="#5a4636"/>
        <path d="M34 97v8M40 97v11M46 97v8" stroke="#b23b30" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <div id="glow" aria-hidden="true"></div>
    </div>
    <div class="hero-text">
      <h1 id="heroTitle">우리 반 비밀 낱말을 찾아라!</h1>
      <p id="heroSub">불러오는 중이에요…</p>
      <div id="meter" aria-hidden="true" hidden><div id="meterFill"></div><span class="m-cold">차가워요</span><span class="m-hot">뜨거워요</span></div>
      <p id="scale"></p>
    </div>
  </section>

  <!-- 출석 번호 넣기 -->
  <form id="numForm" class="card pad" hidden autocomplete="off">
    <h2 class="sec-title">내 출석 번호를 눌러 주세요</h2>
    <div id="numGrid" class="numgrid"></div>
  </form>

  <!-- 반 판: 우리 반이 찾은 가장 가까운 낱말 -->
  <section id="classTop" class="card pad" hidden>
    <div class="ct-head"><span>🔥 우리 반이 찾은 가장 가까운 낱말</span><span id="ctNext"></span></div>
    <div id="ctWords" class="ct-words"></div>
  </section>

  <form id="guessForm" class="card" autocomplete="off" hidden>
    <input id="guess" type="text" inputmode="text" maxlength="20" placeholder="낱말을 써 보세요" aria-label="낱말 쓰기" enterkeyhint="done">
    <button id="btnGo" type="submit" class="btn red">확인</button>
  </form>
  <p id="msg" role="status" aria-live="polite"></p>

  <section id="latest" class="card" hidden></section>

  <section id="listCard" class="card" hidden>
    <div class="list-head"><span>내가 쓴 낱말</span><span id="count"></span></div>
    <table id="list"><thead><tr><th class="c-n">#</th><th class="c-w">낱말</th><th class="c-s">점수</th><th class="c-r">가까움</th></tr></thead><tbody></tbody></table>
  </section>

  <footer id="foot">
    낱말 뜻 자료: <a href="https://fasttext.cc/docs/en/crawl-vectors.html" target="_blank" rel="noopener">fastText</a> (CC BY-SA 3.0) ·
    낱말 목록·뜻풀이: <a href="https://krdict.korean.go.kr" target="_blank" rel="noopener">한국어기초사전</a>,
    <a href="https://github.com/spellcheck-ko/hunspell-dict-ko" target="_blank" rel="noopener">hunspell-dict-ko</a> (CC BY-SA) ·
    <a href="CREDITS.md" target="_blank">만든 사람들</a>
  </footer>
</main>

<div id="modal" hidden>
  <div class="sheet card" role="dialog" aria-modal="true">
    <button class="close ibtn" id="mClose" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
    <div id="mBody"></div>
  </div>
</div>

<!-- 선생님이 띄운 오늘의 한마디 -->
<div id="shout" hidden>
  <div class="lanterns" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="shout-box">
    <div class="shout-kicker">오늘의 따뜻한 한마디</div>
    <p id="shoutText"></p>
    <div class="shout-from">비밀 낱말을 찾은 친구가 우리 반에게</div>
    <button id="shoutClose" class="btn dark small">고마워요!</button>
  </div>
</div>
<div id="confetti" aria-hidden="true"></div>

<script type="module" src="app.js?v=6"></script>
</body>
</html>
